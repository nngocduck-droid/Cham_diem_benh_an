<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chấm Điểm Bệnh Án – đã chuyển địa chỉ</title>
<!--
  Từ phiên bản có tài khoản người dùng, app chỉ chạy trên Railway.
  Trang này (bản Netlify cũ) chỉ chuyển người dùng sang địa chỉ mới.
  Nếu địa chỉ Railway thay đổi, sửa NEW_URL bên dưới (2 chỗ).
-->
<meta http-equiv="refresh" content="0; url=https://chamdiembenhan-production.up.railway.app/">
<style>
  :root { --bg: #0f2744; --card: #ffffff; --text: #111827; --muted: #6b7280; --primary: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --card: #1f2937; --text: #f9fafb; --muted: #9ca3af; --primary: #60a5fa; }
  }
  :root[data-theme="dark"] { --card: #1f2937; --text: #f9fafb; --muted: #9ca3af; --primary: #60a5fa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: linear-gradient(135deg, #0f2744, #1a4a8a); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .box { background: var(--card); color: var(--text); border-radius: 16px; padding: 36px 28px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .icon { font-size: 44px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  a.btn { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .url { display: block; margin-top: 14px; font-size: 12px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🏥</div>
    <h1>App đã chuyển sang địa chỉ mới</h1>
    <p>Ứng dụng Chấm Điểm Bệnh Án nay có tài khoản riêng cho từng người và chạy tại địa chỉ mới. Đang chuyển bạn sang…</p>
    <a class="btn" id="go" href="https://chamdiembenhan-production.up.railway.app/">Mở app</a>
    <span class="url">chamdiembenhan-production.up.railway.app – hãy lưu lại địa chỉ này</span>
  </div>
  <script>
    (function () {
      var NEW_URL = 'https://chamdiembenhan-production.up.railway.app/';
      var target = NEW_URL + (location.search || '') + (location.hash || '');
      document.getElementById('go').href = target;
      location.replace(target);
    })();
  </script>
</body>
</html>
